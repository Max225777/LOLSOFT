<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LOLSOFT</title>
<style>
:root{
  --bg:#111;--bg2:#181818;--card:#1f1f1f;--border:#2e2e2e;
  --accent:#a8c957;--accent-d:#8fae42;--text:#e2e2e2;--sub:#666;
  --red:#ff5252;--yellow:#ffc857;--green:#4caf50;--blue:#4fc3f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column}

/* ── topbar ── */
#topbar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar h1{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:1px}
#topbar .sub{color:var(--sub);font-size:11px}
#ws-dot{width:7px;height:7px;border-radius:50%;background:var(--sub);transition:.3s;margin-left:2px}
#ws-dot.on{background:var(--green)}
.spacer{flex:1}

/* ── main 2-col layout ── */
#main{flex:1;display:flex;overflow:hidden;min-height:0}

/* ── left panel ── */
#left-panel{width:50%;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#left-panel-body{flex:1;overflow-y:auto;padding:10px}

/* ── right panel ── */
#right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* tag stats */
#tag-stats-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#tag-stats-header{padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:8px}
#tag-stats-body{flex:1;overflow-y:auto;padding:8px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:flex-start}
.tag-chip-empty{border:2px dashed #2a2a2a;border-radius:6px;min-height:78px;transition:border-color .15s,background .15s}
.tag-chip-empty.drag-over{border-color:var(--accent);background:#1a2a10}

/* console */
#console{flex-shrink:0;height:210px;background:#0d0d0d;border-top:1px solid var(--border);display:flex;flex-direction:column}
#console-bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#141414;border-bottom:1px solid var(--border);flex-shrink:0}
#console-bar span{font-size:11px;color:var(--sub)}
#console-body{flex:1;overflow-y:auto;padding:4px 10px;font-family:'Consolas','Courier New',monospace;font-size:11px;line-height:1.6;word-break:break-word;white-space:pre-wrap}

/* ── overlay panes (Markets / Schedule / Settings) ── */
#overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column}
#overlay.show{display:flex}
#overlay-nav{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
#overlay-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.overlay-close{background:none;border:1px solid var(--border);color:var(--sub);border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px}
.overlay-close:hover{border-color:var(--accent);color:var(--accent)}

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:12px}
.card-hd{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;font-weight:600}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:var(--sub);white-space:nowrap}

input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 9px;font-size:12px;outline:none;transition:.12s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
input[type=number]{width:72px}
input[type=time]{width:84px}
input.wide{min-width:220px;flex:1}

.btn{padding:6px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.12s;font-family:inherit}
.btn-p{background:var(--accent);color:#111}
.btn-p:hover{background:var(--accent-d)}
.btn-s{padding:3px 9px;font-size:11px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.btn-d{background:#3a1212;color:var(--red);border:1px solid #5c2020}
.btn-d:hover{background:#501616}

/* stat tiles */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:10px}
.stat-tile{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.stat-val{font-size:22px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--sub);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

/* tag chip */
.tag-chip{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 11px;display:flex;flex-direction:column;gap:3px;min-width:120px;cursor:grab;user-select:none;transition:opacity .15s,border-color .15s}
.tag-chip:active{cursor:grabbing}
.tag-chip.drag-over{border-color:var(--accent);opacity:.7}
.tag-chip.dragging{opacity:.35}
.tag-chip-name{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.tag-chip-count{font-size:13px;font-weight:700;color:var(--text)}
.tag-chip-cd{font-size:11px;color:var(--yellow)}
.tag-chip-cd.none{color:var(--green)}

/* market status cards */
.mkt-status-card{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px}
.mkt-status-card.on{border-left:3px solid var(--green)}
.mkt-status-card.off{border-left:3px solid var(--border);opacity:.6}
.mkt-status-card.wait{border-left:3px solid var(--yellow)}
.mkt-head-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mkt-title{font-size:13px;font-weight:700}

/* listings mini table */
.lst-table{width:100%;border-collapse:collapse;font-size:11px}
.lst-table th{background:var(--bg);color:var(--sub);font-size:10px;font-weight:600;padding:4px 7px;text-align:left;border-bottom:1px solid var(--border)}
.lst-table td{padding:4px 7px;border-bottom:1px solid #1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

/* schedule */
.sched-grid{display:flex;gap:2px;align-items:flex-end;margin-top:4px;flex-wrap:wrap}
.sched-cell{width:26px;border-radius:3px 3px 0 0;min-height:6px;cursor:default;position:relative}
.sched-cell:hover .sched-tip{display:block}
.sched-tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;white-space:nowrap;margin-bottom:3px;z-index:10}
.sched-labels{display:flex;gap:2px;flex-wrap:wrap}
.sched-lbl{width:26px;text-align:center;font-size:9px;color:var(--sub)}

/* market config cards */
.mkt-card{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:12px}
.mkt-card.off{opacity:.5}
.mkt-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mkt-name-inp{background:transparent;border:none;font-size:14px;font-weight:700;color:var(--text);flex:1;padding:0;outline:none}
.mkt-name-inp:focus{color:var(--accent)}
.badge{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.b-on{background:#1c3a1c;color:#6dbf6d}
.b-off{background:#3a1c1c;color:#ff7070}
.tags-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag-row{display:flex;align-items:center;gap:4px}
.tag-row input.tname{width:150px}
.tag-row input.tcnt{width:48px}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg2);color:var(--accent);font-size:11px;font-weight:600;padding:7px 10px;text-align:left;position:sticky;top:0;border-bottom:1px solid var(--border)}
td{padding:6px 10px;border-bottom:1px solid #1e1e1e}
tr:hover td{background:#1e1e1e}
.mine{color:var(--accent)}.other{color:#888}

.tok-wrap{position:relative;flex:1;max-width:460px}
.tok-wrap input{width:100%;padding-right:32px}

#toast{position:fixed;bottom:14px;right:14px;padding:9px 15px;border-radius:6px;font-size:12px;font-weight:600;display:none;z-index:9999;pointer-events:none}
.t-ok{background:#1a3a1a;border:1px solid var(--green);color:#6dbf6d}
.t-err{background:#3a1a1a;border:1px solid var(--red);color:#ff7070}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<datalist id="tags-datalist"></datalist>

<!-- ── MAIN 2-COL ── -->
<div id="main">

  <!-- LEFT: topbar + Markets status -->
  <div id="left-panel">
    <div id="topbar">
      <h1>LOLSOFT</h1>
      <div id="ws-dot" title="WebSocket"></div>
      <div class="spacer"></div>
      <span style="font-size:10px;color:var(--sub)">📡 Ринки</span>
      <button class="btn-s" onclick="loadMarketStatus()" style="padding:2px 7px;font-size:10px">🔄</button>
      <div onclick="openOverlay('markets')" style="cursor:pointer;padding:3px 9px;border-radius:5px;font-size:11px;color:var(--sub);border:1px solid var(--border)">🏪 Ринки</div>
      <div onclick="openOverlay('schedule')" style="cursor:pointer;padding:3px 9px;border-radius:5px;font-size:11px;color:var(--sub);border:1px solid var(--border)">🕐</div>
      <div onclick="openOverlay('settings')" style="cursor:pointer;padding:3px 9px;border-radius:5px;font-size:11px;color:var(--sub);border:1px solid var(--border)">⚙</div>
    </div>
    <div id="left-panel-body">
      <div id="day-stats" class="stat-grid"></div>
      <div id="status-list"></div>
    </div>
  </div>

  <!-- RIGHT: tag stats + console -->
  <div id="right-panel">
    <div id="tag-stats-wrap">
      <div id="tag-stats-header">
        <span>📦 Активні лоти по тегах</span>
        <div class="spacer"></div>
        <span style="font-size:10px;color:var(--sub)">🕐 = на кулдауні</span>
        <button class="btn-s" onclick="saveHidden([]);renderTagChips()" title="Показати всі приховані теги" style="padding:2px 7px;font-size:10px">👁</button>
      </div>
      <div id="tag-stats-body">
        <span style="color:var(--sub);font-size:11px;padding:10px">Завантаження…</span>
      </div>
    </div>

    <!-- CONSOLE -->
    <div id="console">
      <div id="console-bar">
        <span style="color:var(--accent);font-weight:700;font-size:11px">CONSOLE</span>
        <div id="ws-dot2" style="width:6px;height:6px;border-radius:50%;background:var(--sub);transition:.3s"></div>
        <span id="console-count" style="color:var(--sub)"></span>
        <div class="spacer"></div>
        <button class="btn-s" onclick="clearLogs()">Очистити</button>
      </div>
      <div id="console-body"></div>
    </div>
  </div>
</div>

<!-- ── OVERLAY (Markets / Schedule / Settings) ── -->
<div id="overlay">
  <div id="overlay-nav">
    <span id="overlay-title" style="font-size:14px;font-weight:700;color:var(--accent)"></span>
    <div class="spacer"></div>
    <button class="overlay-close" onclick="closeOverlay()">✕ Закрити</button>
  </div>
  <div id="overlay-body"></div>
</div>

<div id="toast"></div>

<script>
// ── globals ───────────────────────────────────────────────────────────────────
let CFG = {};
let logLines = [];
let ws = null;
let marketsLocal = [];
let availableTags = [];

// ── api ───────────────────────────────────────────────────────────────────────
async function api(url, opts={}) {
  const r = await fetch(url, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0,120)); }
  return r.json();
}

function x(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = ok ? 't-ok' : 't-err';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.style.display='none', 3000);
}

async function loadCfg() {
  CFG = await api('/api/config');
  marketsLocal = JSON.parse(JSON.stringify(CFG.markets || []));
  return CFG;
}

// ── day stats ─────────────────────────────────────────────────────────────────
async function loadDayStats() {
  try {
    const s = await api('/api/day-stats');
    const el = document.getElementById('day-stats');
    if (!el) return;
    const tile = (val, lbl, color) =>
      `<div class="stat-tile"><div class="stat-val" style="color:${color}">${val}</div><div class="stat-lbl">${lbl}</div></div>`;
    el.innerHTML =
      tile(s.total, 'Спроб', 'var(--text)') +
      tile(s.ok, '✅ Вдало', 'var(--green)') +
      tile(s.fail, '⛔ Невдало', 'var(--red)');
  } catch(e) {}
}

// ── market status (left panel) ────────────────────────────────────────────────
async function loadMarketStatus() {
  loadDayStats();
  try {
    const markets = await api('/api/market-status');
    const c = document.getElementById('status-list');
    c.innerHTML = '';
    if (!markets.length) {
      c.innerHTML = '<div style="color:var(--sub);padding:20px;font-size:12px">Ринків немає — додайте у 🏪 Ринки</div>';
      return;
    }
    markets.forEach(m => c.appendChild(buildStatusCard(m)));
  } catch(e) { console.warn(e); }
}

function buildStatusCard(m) {
  const on = m.enabled && m.active;
  const waiting = m.enabled && !m.active;
  const div = document.createElement('div');
  div.className = 'mkt-status-card ' + (on ? 'on' : waiting ? 'wait' : 'off');

  const hours = m.work_from && m.work_to ? `${m.work_from}–${m.work_to}` : 'цілодобово';
  const statusColor = !m.enabled ? 'var(--sub)' : m.active ? 'var(--green)' : 'var(--yellow)';
  const statusText  = !m.enabled ? 'ВИМК' : m.active ? '●' : '⏳';

  let rows = '';
  if (m.listings && m.listings.length) {
    rows = m.listings.map((l, i) => {
      const mine = l.is_mine;
      const color = mine ? 'var(--green)' : '#666';
      return `<tr style="background:${mine?'#0d1f0d':'#1f0d0d'}">
        <td style="color:var(--sub);width:20px">${i+1}</td>
        <td style="max-width:180px"><a href="${x(l.link||'')}" target="_blank" style="color:${color}">${x(l.title||'')}</a></td>
        <td style="color:${color}">${x(l.seller||'')}</td>
        <td style="color:var(--sub)">${x(l.price||'')}</td>
      </tr>`;
    }).join('');
  } else {
    rows = '<tr><td colspan="4" style="color:var(--sub);text-align:center;padding:8px">Немає даних</td></tr>';
  }

  div.innerHTML = `
    <div class="mkt-head-row">
      <span class="mkt-title">${x(m.name)}</span>
      <span style="color:${statusColor};font-size:13px">${statusText}</span>
      <span style="font-size:10px;color:var(--sub)">${hours}</span>
      <div class="spacer"></div>
      <button class="btn-s" onclick="bumpNow('${x(m.name)}')" style="padding:2px 8px;font-size:10px">⚡</button>
    </div>
    <div style="overflow-x:auto">
      <table class="lst-table">
        <thead><tr><th>#</th><th>Лот</th><th>Продавець</th><th>Ціна</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  return div;
}

// ── tag grid positions + hidden ────────────────────────────────────────────────
const GRID_COLS = 5;

function getHidden()     { try { return JSON.parse(localStorage.getItem('tagHidden') || '[]'); } catch(_) { return []; } }
function saveHidden(h)   { try { localStorage.setItem('tagHidden', JSON.stringify(h)); } catch(_) {} }

function hideTag(tag) {
  const h = getHidden();
  if (!h.includes(tag)) { h.push(tag); saveHidden(h); }
  renderTagChips();
}

// positions: {tagName: cellIndex} — stored in CFG.tag_positions
function getTagPositions() { return (CFG.tag_positions) || {}; }

async function saveTagPositions(positions) {
  CFG.tag_positions = positions;
  try {
    const patch = {...CFG};
    delete patch.token;
    delete patch._token_set;
    await api('/api/config', {method:'POST', body:JSON.stringify({data:patch})});
  } catch(e) { console.warn('saveTagPositions:', e); }
}

// legacy — kept for compat
function sortByOrder(data) { return data; }

// ── tag cooldown stats (right top) ───────────────────────────────────────────
let _lastTagData = [];

async function loadTagStats() {
  try {
    const raw = await api('/api/cooldown-stats');
    _lastTagData = raw;
    renderTagChips();
  } catch(e) { console.warn(e); }
}

function renderTagChips() {
  const el = document.getElementById('tag-stats-body');
  if (!el) return;

  const hidden = getHidden();
  const visible = _lastTagData.filter(t => !hidden.includes(t.tag));

  if (!visible.length) {
    el.innerHTML = '<span style="color:var(--sub);font-size:11px;padding:10px">Кеш ще не завантажено</span>';
    el.style.display = 'flex';
    return;
  }
  el.style.display = 'grid';

  const positions = getTagPositions(); // {tag: cellIndex}

  // Build cell map: cellIndex → tagData
  const cellMap = {};
  const unplaced = [];
  visible.forEach(t => {
    const pos = positions[t.tag];
    if (pos !== undefined) cellMap[pos] = t;
    else unplaced.push(t);
  });

  // Total cells = at least cover all tags + a row of empty slack
  const maxOccupied = Object.keys(cellMap).length ? Math.max(...Object.keys(cellMap).map(Number)) : -1;
  const minCells = Math.max(visible.length + GRID_COLS, maxOccupied + GRID_COLS + 1);
  const totalCells = Math.ceil(minCells / GRID_COLS) * GRID_COLS;

  // Place unplaced tags into first free cells
  let fillPtr = 0;
  for (const t of unplaced) {
    while (cellMap[fillPtr] !== undefined) fillPtr++;
    cellMap[fillPtr] = t;
    positions[t.tag] = fillPtr;
    fillPtr++;
  }

  el.innerHTML = '';

  for (let i = 0; i < totalCells; i++) {
    const t = cellMap[i];
    if (t) {
      const chip = document.createElement('div');
      chip.className = 'tag-chip';
      chip.draggable = true;
      chip.dataset.tag = t.tag;
      chip.dataset.cell = i;
      const cdClass = t.cooldown > 0 ? '' : 'none';
      const cdText  = t.cooldown > 0 ? `🕐 ${t.cooldown}/${t.total}` : `✅ 0/${t.total}`;
      chip.innerHTML = `
        <div style="display:flex;align-items:center;gap:4px">
          <span style="color:#333;font-size:13px;cursor:grab;flex-shrink:0;line-height:1">⠿</span>
          <div class="tag-chip-name" title="${x(t.tag)}" style="flex:1">${x(t.tag)}</div>
          <button onclick="event.stopPropagation();hideTag('${x(t.tag)}')" style="background:none;border:none;color:#333;cursor:pointer;font-size:11px;padding:0 2px;line-height:1;flex-shrink:0" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='#333'">✕</button>
        </div>
        <div class="tag-chip-count">${t.total} <span style="font-size:10px;color:var(--sub)">лотів</span></div>
        <div class="tag-chip-cd ${cdClass}">${cdText}</div>`;

      chip.addEventListener('dragstart', e => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(i));
        setTimeout(() => chip.classList.add('dragging'), 0);
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.addEventListener('dragover', e => { e.preventDefault(); chip.classList.add('drag-over'); });
      chip.addEventListener('dragleave', e => { if (!chip.contains(e.relatedTarget)) chip.classList.remove('drag-over'); });
      chip.addEventListener('drop', e => {
        e.preventDefault(); chip.classList.remove('drag-over');
        _dropToCell(e, i);
      });
      el.appendChild(chip);
    } else {
      const empty = document.createElement('div');
      empty.className = 'tag-chip-empty';
      empty.dataset.cell = i;
      empty.addEventListener('dragover', e => { e.preventDefault(); empty.classList.add('drag-over'); });
      empty.addEventListener('dragleave', e => { if (!empty.contains(e.relatedTarget)) empty.classList.remove('drag-over'); });
      empty.addEventListener('drop', e => {
        e.preventDefault(); empty.classList.remove('drag-over');
        _dropToCell(e, i);
      });
      el.appendChild(empty);
    }
  }
}

function _dropToCell(e, toCell) {
  const fromCell = parseInt(e.dataTransfer.getData('text/plain'));
  if (isNaN(fromCell) || fromCell === toCell) return;

  const pos = getTagPositions();
  // find tags at fromCell and toCell
  const fromTag = Object.keys(pos).find(tag => pos[tag] === fromCell);
  const toTag   = Object.keys(pos).find(tag => pos[tag] === toCell);
  if (!fromTag) return;

  if (toTag) {
    // swap
    pos[fromTag] = toCell;
    pos[toTag]   = fromCell;
  } else {
    // move to empty
    pos[fromTag] = toCell;
  }

  saveTagPositions(pos);
  renderTagChips();
}

// ── overlay (Markets / Schedule / Settings) ───────────────────────────────────
function openOverlay(section) {
  const overlay = document.getElementById('overlay');
  overlay.classList.add('show');
  const titles = {markets:'🏪 Ринки', schedule:'🕐 Розклад', settings:'⚙ Налаштування'};
  document.getElementById('overlay-title').textContent = titles[section] || section;
  const body = document.getElementById('overlay-body');
  body.innerHTML = '<div style="color:var(--sub);padding:20px">Завантаження…</div>';

  if (section === 'markets')  renderMarketsOverlay(body);
  if (section === 'schedule') renderScheduleOverlay(body);
  if (section === 'settings') renderSettingsOverlay(body);
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

// ── markets overlay ───────────────────────────────────────────────────────────
async function renderMarketsOverlay(body) {
  await loadCfg();
  await loadAvailableTags();
  body.innerHTML = '';

  // toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'row';
  toolbar.style.marginBottom = '10px';
  toolbar.innerHTML = `
    <button class="btn btn-p" onclick="addMarket()">+ Додати ринок</button>
    <button class="btn-s" onclick="saveAll()">💾 Зберегти все</button>
    <div class="spacer"></div>
    <select id="mkt-sel" style="min-width:160px" onchange="loadListings()"></select>
    <button class="btn-s" onclick="loadListings()">🔄 Таблиця</button>`;
  body.appendChild(toolbar);

  const list = document.createElement('div');
  list.id = 'markets-list';
  list.className = 'col';
  body.appendChild(list);
  marketsLocal.forEach((m, i) => list.appendChild(buildMktCard(m, i)));
  _rebuildMktSelect();

  const listingsCard = document.createElement('div');
  listingsCard.className = 'card';
  listingsCard.innerHTML = `
    <div class="card-hd">Лоти: <span id="lst-name" style="color:var(--accent)"></span></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>Назва</th><th>Продавець</th><th>Ціна</th><th>Піднято</th><th>Мій</th></tr></thead>
        <tbody id="lst-body"><tr><td colspan="6" style="color:var(--sub);text-align:center;padding:20px">Оберіть ринок →</td></tr></tbody>
      </table>
    </div>`;
  body.appendChild(listingsCard);
}

async function loadAvailableTags() {
  try {
    availableTags = await api('/api/tags');
    const dl = document.getElementById('tags-datalist');
    if (dl) dl.innerHTML = availableTags.map(t => `<option value="${x(t)}">`).join('');
  } catch(e) {}
}

function _renderMarketList() {
  const c = document.getElementById('markets-list');
  if (!c) return;
  c.innerHTML = '';
  marketsLocal.forEach((m, i) => c.appendChild(buildMktCard(m, i)));
}

function _rebuildMktSelect() {
  const sel = document.getElementById('mkt-sel');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '';
  marketsLocal.forEach(m => {
    const o = document.createElement('option');
    o.value = m.name; o.textContent = m.name;
    sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}

function buildMktCard(m, idx) {
  const div = document.createElement('div');
  div.className = 'mkt-card' + (m.enabled===false?' off':'');
  div.dataset.idx = idx;
  const on = m.enabled !== false;
  div.innerHTML = `
    <div class="mkt-head">
      <input class="mkt-name-inp" value="${x(m.name)}" placeholder="Назва"/>
      <span class="badge ${on?'b-on':'b-off'}" id="bdg-${idx}">${on?'ON':'OFF'}</span>
      <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);cursor:pointer">
        <input type="checkbox" class="mkt-en" ${on?'checked':''} onchange="toggleMktEnabled(this,${idx})"/> Активний
      </label>
      <button class="btn-s btn-d" onclick="removeMkt(${idx})">✕</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <label>URL:</label>
      <input class="wide mkt-url" value="${x(m.url||'')}"/>
    </div>
    <div class="row" style="row-gap:6px">
      <label>Лотів:</label><input type="number" class="mkt-cnt" value="${m.count||10}" min="1" max="50"/>
      <label>Топ-N:</label><input type="number" class="mkt-topn" value="${m.top_n||1}" min="1" max="20"/>
      <label>Оновл. (с):</label><input type="number" class="mkt-ri" value="${m.refresh_interval||60}" min="30" max="3600"/>
      <label>Підн. (с):</label><input type="number" class="mkt-bi" value="${m.bump_interval||60}" min="30" max="3600"/>
    </div>
    <div class="row" style="margin-top:8px">
      <label>🕐 Робочі години:</label>
      <input type="time" class="mkt-from" value="${m.work_from||''}"/>
      <span style="color:var(--sub)">—</span>
      <input type="time" class="mkt-to" value="${m.work_to||''}"/>
      <span style="font-size:10px;color:var(--sub)">(порожньо = цілодобово)</span>
    </div>
    <div class="card-hd" style="margin-top:10px">Теги для підняття</div>
    <div class="tags-grid mkt-tags">
      ${(m.tags||[]).map(t=>`
        <div class="tag-row">
          <input class="tname" value="${x(t.tag||'')}" placeholder="Назва тегу" list="tags-datalist" autocomplete="off"/>
          <input class="tcnt" type="number" value="${t.count||1}" min="1" max="50"/>
          <button class="btn-s" onclick="this.closest('.tag-row').remove()">✕</button>
        </div>`).join('')}
    </div>
    <div class="row" style="margin-top:8px;gap:6px">
      <button class="btn-s" onclick="addTagRow(this)">+ Тег</button>
      <button class="btn-s" onclick="bumpNow('${x(m.name)}')">⚡ Підняти зараз</button>
      <button class="btn-s" onclick="refreshMarketTags('${x(m.name)}')">🏷 Теги</button>
      <button class="btn-s" onclick="refreshMarketItems('${x(m.name)}')">📦 Лоти</button>
    </div>`;
  return div;
}

function toggleMktEnabled(chk, idx) {
  const card = chk.closest('.mkt-card');
  const on = chk.checked;
  card.classList.toggle('off', !on);
  card.querySelector('.badge').className = 'badge '+(on?'b-on':'b-off');
  card.querySelector('.badge').textContent = on?'ON':'OFF';
}

function addTagRow(btn) {
  const grid = btn.closest('.mkt-card').querySelector('.mkt-tags');
  const d = document.createElement('div');
  d.className = 'tag-row';
  d.innerHTML = `<input class="tname" placeholder="Назва тегу" list="tags-datalist" autocomplete="off"/>
    <input class="tcnt" type="number" value="1" min="1" max="50"/>
    <button class="btn-s" onclick="this.closest('.tag-row').remove()">✕</button>`;
  grid.appendChild(d);
}

function addMarket() {
  const newMkt = {name:'Новий ринок',url:'',tags:[],count:10,top_n:1,
    refresh_interval:60,bump_interval:60,enabled:true,work_from:'',work_to:''};
  marketsLocal.push(newMkt);
  const c = document.getElementById('markets-list');
  if (c) c.appendChild(buildMktCard(newMkt, marketsLocal.length-1));
  _rebuildMktSelect();
}

function removeMkt(idx) {
  if (!confirm('Видалити ринок?')) return;
  marketsLocal.splice(idx, 1);
  _renderMarketList();
  _rebuildMktSelect();
}

function collectMarkets() {
  return Array.from(document.querySelectorAll('.mkt-card')).map(card => ({
    name:             card.querySelector('.mkt-name-inp').value.trim(),
    url:              card.querySelector('.mkt-url').value.trim(),
    count:            +card.querySelector('.mkt-cnt').value||10,
    top_n:            +card.querySelector('.mkt-topn').value||1,
    refresh_interval: +card.querySelector('.mkt-ri').value||60,
    bump_interval:    +card.querySelector('.mkt-bi').value||60,
    work_from:        card.querySelector('.mkt-from').value,
    work_to:          card.querySelector('.mkt-to').value,
    enabled:          card.querySelector('.mkt-en').checked,
    tags: Array.from(card.querySelectorAll('.tag-row'))
      .map(r=>({tag:r.querySelector('.tname').value.trim(), count:+r.querySelector('.tcnt').value||1}))
      .filter(t=>t.tag),
  }));
}

// ── schedule overlay ──────────────────────────────────────────────────────────
async function renderScheduleOverlay(body) {
  await loadCfg();
  body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = '<div class="card-hd">Розклад роботи по ринках — 24 год.</div><div id="sched-container" class="col" style="gap:14px;margin-top:4px"></div>';
  body.appendChild(wrap);

  const c = document.getElementById('sched-container');
  const markets = CFG.markets || [];
  if (!markets.length) { c.innerHTML = '<div style="color:var(--sub)">Ринків немає</div>'; return; }

  markets.forEach(m => {
    const from = m.work_from ? parseInt(m.work_from.split(':')[0]) : 0;
    const to   = m.work_to   ? parseInt(m.work_to.split(':')[0])   : 23;
    const allDay = !m.work_from && !m.work_to;
    const cells = Array.from({length:24},(_,h)=>{
      const active = m.enabled!==false && (allDay || (h>=from && h<=to));
      return `<div class="sched-cell" style="background:${active?'var(--green)':'var(--border)'};height:${active?22:10}px">
        <div class="sched-tip">${h}:00${active?' ✅':' —'}</div></div>`;
    }).join('');
    const lbls = Array.from({length:24},(_,h)=>`<div class="sched-lbl">${h}</div>`).join('');
    const d = document.createElement('div');
    d.innerHTML = `
      <div style="font-size:13px;font-weight:600;margin-bottom:6px;color:${m.enabled!==false?'var(--text)':'var(--sub)'}">
        ${x(m.name)}
        <span style="font-size:10px;font-weight:400;color:var(--sub);margin-left:8px">
          ${allDay?'цілодобово':(m.work_from+' — '+m.work_to)}
          ${m.enabled===false?' [вимкнено]':''}
        </span>
      </div>
      <div class="sched-grid">${cells}</div>
      <div class="sched-labels">${lbls}</div>`;
    c.appendChild(d);
  });
}

// ── settings overlay ──────────────────────────────────────────────────────────
async function renderSettingsOverlay(body) {
  await loadCfg();
  body.innerHTML = '';

  const tokenCard = document.createElement('div');
  tokenCard.className = 'card';
  tokenCard.innerHTML = `
    <div class="card-hd">API Токен</div>
    <div style="font-size:12px;color:var(--sub)">
      Токен береться з env var <b style="color:var(--accent)">LOLZ_TOKEN</b> на Render —
      ${CFG._token_set
        ? '<span style="color:var(--green)">✅ встановлено</span>'
        : '<span style="color:var(--red)">⛔ не встановлено</span>'}
    </div>`;
  body.appendChild(tokenCard);

  const autoCard = document.createElement('div');
  autoCard.className = 'card';
  autoCard.innerHTML = `
    <div class="card-hd">Автоматизація</div>
    <div style="font-size:12px;color:var(--green)">✅ Авто-підняття і авто-оновлення завжди увімкнено</div>`;
  body.appendChild(autoCard);

  // cache status
  let cacheHtml = '';
  try {
    const s = await api('/api/cache-status');
    cacheHtml = s.loaded_at
      ? `<span style="color:var(--green)">✅ Завантажено о ${s.loaded_at}</span> — ${s.total_items} лотів`
      : '<span style="color:var(--yellow)">⏳ Ще не завантажено</span>';
    const tagChips = s.tags.length
      ? s.tags.map(t=>`<span style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px">
          <span style="color:var(--accent)">${x(t.tag)}</span>
          <span style="color:var(--sub)"> ${t.count}</span></span>`).join('')
      : '';
    const cacheCard = document.createElement('div');
    cacheCard.className = 'card';
    cacheCard.innerHTML = `
      <div class="card-hd">Статус кешу лотів</div>
      <div style="font-size:12px;color:var(--sub)">${cacheHtml}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${tagChips}</div>
      <div class="row" style="margin-top:8px;gap:6px">
        <button class="btn-s" onclick="refreshMarketTags('')">🏷 Теги</button>
        <button class="btn-s" onclick="refreshMarketItems('')">📦 Лоти</button>
      </div>`;
    body.appendChild(cacheCard);
  } catch(e) {}

  const saveCard = document.createElement('div');
  saveCard.className = 'card';
  saveCard.innerHTML = `
    <div class="row" style="gap:8px">
      <button class="btn btn-p" onclick="saveAll()">💾 Зберегти</button>
      <button class="btn-s" onclick="location.href='/api/download-zip'">⬇ ZIP</button>
      <button class="btn-s" onclick="copyConfigJson()" title="Скопіювати конфіг для Render ENV">📋 CONFIG_JSON</button>
    </div>
    <div id="save-hint" style="font-size:11px;color:var(--sub);margin-top:8px"></div>
    <div style="font-size:11px;color:var(--sub);margin-top:6px">📋 <b style="color:var(--text)">CONFIG_JSON</b> — встав як env var на Render.</div>`;
  body.appendChild(saveCard);
}

// ── listings table ─────────────────────────────────────────────────────────────
async function loadListings() {
  const sel = document.getElementById('mkt-sel');
  if (!sel) return;
  const name = sel.value;
  if (!name) return;
  const nameEl = document.getElementById('lst-name');
  if (nameEl) nameEl.textContent = name;
  const tb = document.getElementById('lst-body');
  if (!tb) return;
  tb.innerHTML = '<tr><td colspan="6" style="color:var(--sub);text-align:center">Завантаження…</td></tr>';
  try {
    const data = await api('/api/market-listings/'+encodeURIComponent(name));
    tb.innerHTML = '';
    data.forEach((l,i)=>{
      const cls = l.is_mine?'mine':'other';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i+1}</td>
        <td><a href="${l.link}" target="_blank" class="${cls}">${x(l.title)}</a></td>
        <td class="${cls}">${x(l.seller)}</td>
        <td>${x(l.price)}</td>
        <td style="font-size:10px;color:var(--sub)">${l.bumped_at||''}</td>
        <td>${l.is_mine?'✓':''}</td>`;
      tb.appendChild(tr);
    });
  } catch(e) {
    tb.innerHTML = `<tr><td colspan="6" style="color:var(--red)">Помилка: ${e.message}</td></tr>`;
  }
}

// ── save / refresh ─────────────────────────────────────────────────────────────
async function saveAll() {
  const domCards = document.querySelectorAll('.mkt-card');
  const markets = domCards.length ? collectMarkets() : marketsLocal;
  const patch = {...CFG, autorefresh:true, autobump:true, markets};
  delete patch.token;
  try {
    await api('/api/config', {method:'POST', body:JSON.stringify({data:patch})});
    toast('✅ Збережено');
    const hint = document.getElementById('save-hint');
    if (hint) hint.textContent = 'Збережено: '+new Date().toLocaleTimeString();
    await loadCfg();
  } catch(e) { toast('⛔ '+e.message, false); }
}

async function refreshMarketTags(name) {
  try { await api('/api/refresh-tags', {method:'POST'}); toast('🏷 Теги оновлюються…'); } catch(e) { toast('⛔ '+e.message, false); }
}

async function refreshMarketItems(name) {
  try {
    await api('/api/refresh-cache', {method:'POST'});
    toast('📦 Лоти оновлюються…');
    setTimeout(loadTagStats, 5000);
  } catch(e) { toast('⛔ '+e.message, false); }
}

async function copyConfigJson() {
  try {
    const cfg = await api('/api/config');
    const out = {...cfg};
    delete out._token_set;
    delete out.token;
    await navigator.clipboard.writeText(JSON.stringify(out));
    toast('📋 CONFIG_JSON скопійовано — встав в Render → Environment');
  } catch(e) { toast('⛔ '+e.message, false); }
}

async function bumpNow(name) {
  try {
    await api('/api/bump-now/'+encodeURIComponent(name), {method:'POST'});
    toast('⚡ Підняття: '+name);
  } catch(e) { toast('⛔ '+e.message, false); }
}

// ── WebSocket + console ────────────────────────────────────────────────────────
// Messages to hide (спам без корисної інфо)
function shouldHideLog(text) {
  if (!text) return false;
  if (text.includes('— ліміт, кулдаун')) return true;
  if (/не вдалось підняти/.test(text)) return true;
  return false;
}

function connectWS() {
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/logs`);
  const setDot = (on) => {
    [document.getElementById('ws-dot'), document.getElementById('ws-dot2')]
      .forEach(d=>{ if(d){ d.style.background=on?'var(--green)':'var(--sub)'; d.classList.toggle('on',on); } });
  };
  ws.onopen  = () => setDot(true);
  ws.onclose = () => { setDot(false); setTimeout(connectWS, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    try { addLogLine(JSON.parse(e.data)); } catch(_) {}
  };
}

function addLogLine(msg) {
  if (shouldHideLog(msg.text)) return;
  logLines.push(msg);
  if (logLines.length > 500) logLines = logLines.slice(-500);
  _paintConsole();
}

function _paintConsole() {
  const el = document.getElementById('console-body');
  if (!el) return;
  const atBot = el.scrollHeight - el.scrollTop <= el.clientHeight + 40;
  el.innerHTML = logLines.map(m => {
    const col = {ok:'#6dbf6d', warn:'#ffc857', error:'#ff5252', info:'#444'}[m.level]||'#444';
    return `<div><span style="color:#2a2a2a">${m.time} </span><span style="color:${col}">${x(m.text)}</span></div>`;
  }).join('');
  if (atBot) el.scrollTop = el.scrollHeight;
  const cnt = document.getElementById('console-count');
  if (cnt) cnt.textContent = logLines.length + ' рядків';
}

function clearLogs() { logLines=[]; _paintConsole(); }

// ── init ──────────────────────────────────────────────────────────────────────
(async () => {
  connectWS();
  await loadCfg();
  loadMarketStatus();
  loadTagStats();
  setInterval(loadMarketStatus, 15000);
  setInterval(loadTagStats, 10000);
})();
</script>
