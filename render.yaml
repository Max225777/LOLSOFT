services:
  - type: web
    name: lolsoft
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r web/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: lolsoft-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LOLZ_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
